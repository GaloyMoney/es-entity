[package]
name = "es-entity-fuzz"
version = "0.12.5"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
es-entity = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["clock"], default-features = false }
uuid = { version = "1.0", features = ["serde", "v7"] }

[[bin]]
name = "fuzz_parse_constraint_detail"
path = "fuzz_targets/fuzz_parse_constraint_detail.rs"
test = false
doc = false

[[bin]]
name = "fuzz_event_hydration"
path = "fuzz_targets/fuzz_event_hydration.rs"
test = false
doc = false

# Standalone workspace so the fuzz crate is excluded from the parent workspace
# (cargo-fuzz convention).
[workspace]
