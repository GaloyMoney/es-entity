#@ load("@ytt:data", "data")

#@ load("vendor/pipeline-fragments.lib.yml",
#@   "public_docker_registry",
#@   "repo_resource",
#@   "version_resource",
#@   "pipeline_tasks_resource",
#@   "release_task_image_config",
#@   "rust_task_image_config",
#@   "gh_release_resource",
#@   "nix_task_image_config",
#@   "gcr_resource_type",
#@ )

#@ def retry_task():
task: wait-and-retry
config:
  platform: linux
  image_resource: #@ release_task_image_config()
  run:
    path: sh
    args:
    - "-c"
    - "sleep 5"
#@ end

#! Fires a Zenduty alert (non-critical) — used as a job-level on_failure/on_error
#! hook so a failed/crashed fuzz run pages the on-call rotation, same as the
#! lana-bank pipeline. Requires the `zenduty-notification` resource + type below.
#@ def zenduty_notification_hook():
put: zenduty-notification
params:
  alert_type: non-critical
#@ end

groups:
- name: es-entity
  jobs:
  - check-code
  - tests
  - release
  - set-dev-version
  - fuzz

jobs:
#! Nightly coverage-guided fuzzing (cargo-fuzz / libFuzzer).
#!
#! The targets are pure (no Postgres), so this runs lighter than `tests`. The
#! evolving corpus is persisted to GCS, NOT via a Concourse resource: the task
#! itself downloads the latest corpus (gsutil) before fuzzing and uploads the
#! grown one after — so the very first run self-bootstraps (no corpus → fuzzes
#! from scratch → uploads). Each run fuzzes both targets in parallel (2
#! libFuzzer processes = 2 cores) for FUZZ_SECONDS. A crash fails the job
#! (existing Zenduty alert fires) and skips the upload so a crashing run isn't
#! persisted.
- name: fuzz
  serial: true
  plan:
  - in_parallel:
    - { get: repo }
    - { get: pipeline-tasks }
    - { get: fuzz-time, trigger: true }
  - task: fuzz
    config:
      platform: linux
      image_resource: #@ nix_task_image_config()
      inputs:
      - name: repo
      caches:
      - path: cargo-home
      - path: cargo-target-dir
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME
            # `nix develop .#fuzz` provides the Rust toolchain + cargo-fuzz +
            # gsutil (google-cloud-sdk). ci/fuzz.sh restores the latest corpus
            # from GCS (or bootstraps from scratch) and uploads the grown one.
            cachix watch-exec $CACHIX_CACHE_NAME -- nix -L develop .#fuzz -c sh -exc '
              set -euo pipefail
              export CARGO_HOME=$PWD/../cargo-home
              export CARGO_TARGET_DIR=$PWD/../cargo-target-dir
              bash ci/fuzz.sh
            '
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
        FUZZ_SECONDS: "3600"    #! 1h per target per daily run (bump to 4h once proven)
        GCS_BUCKET: ((staging-gcp-creds.bucket_name))
        GCS_CREDS: ((staging-gcp-creds.creds_json))
        GCS_PREFIX: #@ data.values.gh_repository + "-artifacts/fuzz-corpus"
  on_failure: #@ zenduty_notification_hook()
  on_error: #@ zenduty_notification_hook()

- name: check-code
  serial: true
  plan:
  - in_parallel:
    - { get: repo, trigger: true }
    - { get: pipeline-tasks }
  - task: check-code
    config:
      platform: linux
      image_resource: #@ nix_task_image_config()
      inputs:
      - name: repo
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME
            cachix watch-exec $CACHIX_CACHE_NAME -- nix flake check
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name

- name: tests
  plan:
    - in_parallel:
      - get: repo
        trigger: true
      - { get: pipeline-tasks }
    - task: tests
      attempts: 2
      config:
        platform: linux
        image_resource: #@ nix_task_image_config()
        inputs:
          - name: repo
        run:
          path: sh
          args:
            - -exc
            - |
              set -euo pipefail
              cd repo
              cachix use $CACHIX_CACHE_NAME
              cachix watch-exec $CACHIX_CACHE_NAME -- nix run .#nextest
        params:
          CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
          CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
- name: release
  serial: true
  plan:
  - in_parallel:
    - get: repo
      passed:
      - check-code
      - tests
    - get: pipeline-tasks
    - get: version
  - task: prep-release
    config:
      platform: linux
      image_resource: #@ release_task_image_config()
      inputs:
      - name: pipeline-tasks
      - name: repo
      - name: version
      outputs:
      - name: version
      - name: artifacts
      run:
        path: pipeline-tasks/ci/vendor/tasks/prep-release-src.sh
  - task: update-repo
    config:
      platform: linux
      image_resource: #@ rust_task_image_config()
      inputs:
      - name: artifacts
      - name: pipeline-tasks
      - name: repo
      - name: version
      outputs:
      - name: repo
      run:
        path: pipeline-tasks/ci/tasks/update-repo.sh
  - task: publish-to-crates
    config:
      image_resource: #@ rust_task_image_config()
      platform: linux
      inputs:
      - name: version
      - name: pipeline-tasks
      - name: repo
      params:
        CRATES_API_TOKEN: #@ data.values.crates_api_token
      caches:
      - path: cargo-home
      - path: cargo-target-dir
      run:
        path: pipeline-tasks/ci/tasks/publish-to-crates.sh
  - put: repo
    attempts: 3
    params:
      tag: artifacts/gh-release-tag
      repository: repo
      merge: true
    on_failure: #@ retry_task()
  - put: gh-release
    params:
      name: artifacts/gh-release-name
      tag: artifacts/gh-release-tag
      body: artifacts/gh-release-notes.md
  - put: version
    attempts: 3
    params:
      file: version/version
    on_failure: #@ retry_task()

- name: set-dev-version
  plan:
  - in_parallel:
    - { get: repo, passed: [release] }
    - { get: pipeline-tasks }
    - get: version
      trigger: true
      params: { bump: patch }
      passed: [release]
  - task: set-dev-version
    config:
      image_resource: #@ rust_task_image_config()
      platform: linux
      inputs:
      - name: version
      - name: repo
      - name: pipeline-tasks
      outputs:
      - name: repo
      run:
        path: pipeline-tasks/ci/tasks/set-dev-version.sh
      params:
        BRANCH: #@ data.values.git_branch
  - put: repo
    params:
      repository: repo
      rebase: true


resources:
- #@ repo_resource(True)
- #@ gh_release_resource()
- #@ pipeline_tasks_resource()
- #@ version_resource()

#! Versioned tarball of the evolving libFuzzer corpus. `get` restores the latest
#! before a fuzz run; `put` uploads the grown one after (filenames embed a
#! UTC timestamp so the regex capture group orders them correctly).
#! NOTE: reuses the shared `staging-gcp-creds` bucket like `bundled_deps_resource`;
#! swap for a dedicated fuzz credential if that isn't available to this team.
- name: fuzz-time
  type: time
  source:
    interval: 24h

- name: zenduty-notification
  type: zenduty-notification
  source:
    webhook_url: #@ data.values.zenduty_webhook_url

resource_types:
- name: zenduty-notification
  type: registry-image
  source:
    username: #@ data.values.gar_registry_user
    password: #@ data.values.gar_registry_password
    repository: #@ public_docker_registry() + "/zenduty-notification-resource"
    tag: edge
