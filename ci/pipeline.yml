#@ load("@ytt:data", "data")

#@ load("vendor/pipeline-fragments.lib.yml",
#@   "public_docker_registry",
#@   "repo_resource",
#@   "version_resource",
#@   "pipeline_tasks_resource",
#@   "release_task_image_config",
#@   "rust_task_image_config",
#@   "gh_release_resource",
#@   "nix_task_image_config",
#@   "gcr_resource_type",
#@ )

#@ def retry_task():
task: wait-and-retry
config:
  platform: linux
  image_resource: #@ release_task_image_config()
  run:
    path: sh
    args:
    - "-c"
    - "sleep 5"
#@ end

groups:
- name: es-entity
  jobs:
  - check-code
  - tests
  - release
  - set-dev-version
  - fuzz

jobs:
#! Nightly coverage-guided fuzzing (cargo-fuzz / libFuzzer).
#!
#! The targets are pure (no Postgres), so this runs lighter than `tests`. The
#! evolving corpus is persisted to GCS (not git): `get` restores the latest
#! corpus tarball before fuzzing, and `put` uploads the grown one after, so
#! coverage accumulates across daily runs. Each run fuzzes both targets in
#! parallel (2 libFuzzer processes = 2 cores, bounded well under the worker's
#! capacity) for FUZZ_SECONDS wall time. A crash fails the job (the existing
#! Zenduty alert on failed jobs fires) and the crash input is left in the build
#! log; the corpus tarball upload is skipped so we don't persist a crashing run.
- name: fuzz
  serial: true
  plan:
  - in_parallel:
    - { get: repo }
    - { get: pipeline-tasks }
    - { get: fuzz-time, trigger: true }
    - { get: fuzz-corpus }
  - task: fuzz
    config:
      platform: linux
      image_resource: #@ nix_task_image_config()
      inputs:
      - name: repo
      - name: fuzz-corpus
      outputs:
      - name: fuzz-corpus-out
      caches:
      - path: cargo-home
      - path: cargo-target-dir
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME
            cachix watch-exec $CACHIX_CACHE_NAME -- nix -L develop . -c sh -exc '
              set -euo pipefail
              export CARGO_HOME=$PWD/../cargo-home
              export CARGO_TARGET_DIR=$PWD/../cargo-target-dir

              # cargo-fuzz is cached across runs via the cargo-home cache.
              cargo install cargo-fuzz --locked || true

              # Restore the evolving corpus from GCS (no-op on the first run).
              mkdir -p fuzz/corpus
              if compgen -G "../fuzz-corpus/*.tgz" > /dev/null; then
                tar -xzf ../fuzz-corpus/*.tgz -C fuzz/
              fi

              (cd fuzz && cargo fuzz build --sanitizer=none)

              # Run both targets in parallel (2 libFuzzer processes = 2 cores).
              # To use more of the CPU budget, add `-jobs=N` to each (N cores per
              # target); keep total processes <= the worker bound.
              pids=""; rc=0
              for target in fuzz_parse_constraint_detail fuzz_event_hydration; do
                (cd fuzz && cargo fuzz run "$target" --sanitizer=none -- \
                  -max_total_time="$FUZZ_SECONDS" -timeout=25 \
                  -artifact_prefix="artifacts/$target/") &
                pids="$pids $!"
              done
              for p in $pids; do wait "$p" || rc=1; done

              if [ "$rc" -ne 0 ]; then
                echo "==== FUZZ CRASH DETECTED ===="
                find fuzz/artifacts -type f -print || true
                exit "$rc"
              fi

              # Package the evolved corpus for GCS.
              mkdir -p ../fuzz-corpus-out
              ts=$(date -u +%Y%m%d-%H%M%S)
              tar -czf "../fuzz-corpus-out/corpus-v${ts}.tgz" -C fuzz corpus
              echo "packaged corpus-v${ts}.tgz"
            '
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
        FUZZ_SECONDS: "14400"   #! 4h per target per daily run
  - put: fuzz-corpus
    params:
      file: fuzz-corpus-out/corpus-v*.tgz

- name: check-code
  serial: true
  plan:
  - in_parallel:
    - { get: repo, trigger: true }
    - { get: pipeline-tasks }
  - task: check-code
    config:
      platform: linux
      image_resource: #@ nix_task_image_config()
      inputs:
      - name: repo
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            cd repo
            cachix use $CACHIX_CACHE_NAME
            cachix watch-exec $CACHIX_CACHE_NAME -- nix flake check
      params:
        CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
        CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name

- name: tests
  plan:
    - in_parallel:
      - get: repo
        trigger: true
      - { get: pipeline-tasks }
    - task: tests
      attempts: 2
      config:
        platform: linux
        image_resource: #@ nix_task_image_config()
        inputs:
          - name: repo
        run:
          path: sh
          args:
            - -exc
            - |
              set -euo pipefail
              cd repo
              cachix use $CACHIX_CACHE_NAME
              cachix watch-exec $CACHIX_CACHE_NAME -- nix run .#nextest
        params:
          CACHIX_AUTH_TOKEN: #@ data.values.cachix_auth_token
          CACHIX_CACHE_NAME: #@ data.values.cachix_cache_name
- name: release
  serial: true
  plan:
  - in_parallel:
    - get: repo
      passed:
      - check-code
      - tests
    - get: pipeline-tasks
    - get: version
  - task: prep-release
    config:
      platform: linux
      image_resource: #@ release_task_image_config()
      inputs:
      - name: pipeline-tasks
      - name: repo
      - name: version
      outputs:
      - name: version
      - name: artifacts
      run:
        path: pipeline-tasks/ci/vendor/tasks/prep-release-src.sh
  - task: update-repo
    config:
      platform: linux
      image_resource: #@ rust_task_image_config()
      inputs:
      - name: artifacts
      - name: pipeline-tasks
      - name: repo
      - name: version
      outputs:
      - name: repo
      run:
        path: pipeline-tasks/ci/tasks/update-repo.sh
  - task: publish-to-crates
    config:
      image_resource: #@ rust_task_image_config()
      platform: linux
      inputs:
      - name: version
      - name: pipeline-tasks
      - name: repo
      params:
        CRATES_API_TOKEN: #@ data.values.crates_api_token
      caches:
      - path: cargo-home
      - path: cargo-target-dir
      run:
        path: pipeline-tasks/ci/tasks/publish-to-crates.sh
  - put: repo
    attempts: 3
    params:
      tag: artifacts/gh-release-tag
      repository: repo
      merge: true
    on_failure: #@ retry_task()
  - put: gh-release
    params:
      name: artifacts/gh-release-name
      tag: artifacts/gh-release-tag
      body: artifacts/gh-release-notes.md
  - put: version
    attempts: 3
    params:
      file: version/version
    on_failure: #@ retry_task()

- name: set-dev-version
  plan:
  - in_parallel:
    - { get: repo, passed: [release] }
    - { get: pipeline-tasks }
    - get: version
      trigger: true
      params: { bump: patch }
      passed: [release]
  - task: set-dev-version
    config:
      image_resource: #@ rust_task_image_config()
      platform: linux
      inputs:
      - name: version
      - name: repo
      - name: pipeline-tasks
      outputs:
      - name: repo
      run:
        path: pipeline-tasks/ci/tasks/set-dev-version.sh
      params:
        BRANCH: #@ data.values.git_branch
  - put: repo
    params:
      repository: repo
      rebase: true


resources:
- #@ repo_resource(True)
- #@ gh_release_resource()
- #@ pipeline_tasks_resource()
- #@ version_resource()

#! Versioned tarball of the evolving libFuzzer corpus. `get` restores the latest
#! before a fuzz run; `put` uploads the grown one after (filenames embed a
#! UTC timestamp so the regex capture group orders them correctly).
#! NOTE: reuses the shared `staging-gcp-creds` bucket like `bundled_deps_resource`;
#! swap for a dedicated fuzz credential if that isn't available to this team.
- name: fuzz-corpus
  type: gcs-resource
  source:
    bucket: ((staging-gcp-creds.bucket_name))
    json_key: ((staging-gcp-creds.creds_json))
    regexp: #@ data.values.gh_repository + "-artifacts/fuzz-corpus/corpus-v(.*).tgz"
- name: fuzz-time
  type: time
  source:
    interval: 24h

resource_types:
- #@ gcr_resource_type()
