[package]
name = "es-entity-macros"
description = "Proc macros for es-entity"
repository = "https://github.com/GaloyMoney/cala"
version = "0.12.11"
edition = "2024"
license = "Apache-2.0"
categories = ["data-structures", "database"]

[features]

fail-on-warnings = []
graphql = []
event-context = ["event-context-enabled"]
event-context-enabled = []
instrument = []

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
syn = "3.0"
quote = "1.0"
darling = "0.24"
pluralizer = "0.5"
convert_case = "0.11"
regex = "1.12"
# Minimal features: `recursive-protection` (default) would pull in
# recursive -> stacker -> psm (C + build.rs) + libc and the
# `Apache-2.0 WITH LLVM-exception` license. Migrations are shallow DDL, so the
# stack-overflow guard is unnecessary; this leaves `log` as the only new dep.
sqlparser = { version = "0.62", default-features = false, features = ["std"] }
