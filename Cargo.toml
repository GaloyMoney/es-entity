[package]
name = "es-entity"
description = "Event Sourcing Entity Framework"
repository = "https://github.com/GaloyMoney/es-entity"
documentation = "https://docs.rs/es-entity"
version = "0.14.4-dev"
edition = "2024"
license = "Apache-2.0"
categories = ["data-structures", "database"]
include = ["src/**/*", "build.rs", "README.md", "LICENSE", "CHANGELOG.md"]

[profile.mdbook-test]
inherits = "dev"

[features]

fail-on-warnings = ["es-entity-macros/fail-on-warnings"]
tracing-context = ["dep:tracing", "dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk"]
graphql = ["es-entity-macros/graphql", "dep:async-graphql", "dep:base64"]
event-context = ["es-entity-macros/event-context", "event-context-enabled"]
event-context-enabled = ["es-entity-macros/event-context-enabled"]
json-schema = ["dep:schemars"]
mdbook-test = ["dep:anyhow"]
# Split out so a consumer (job) can pull in the errlanes recorder without
# turning on repo-span instrumentation.
errlanes-tracing = ["errlanes/tracing"]
instrument = ["es-entity-macros/instrument", "dep:tracing", "errlanes-tracing"]
# Re-exports of errlanes' blessed foreign-error `Classify` impls, so a
# consumer (job, lana) enables them through es-entity rather than taking a
# direct errlanes dependency.
errlanes-classify-serde-json = ["errlanes/classify-serde-json"]
errlanes-classify-reqwest = ["errlanes/classify-reqwest"]

[dependencies]
es-entity-macros = { workspace = true }
errlanes = { workspace = true, features = ["classify-sqlx", "derive"] }

async-stream = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true, optional = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
chrono =  { workspace = true }
serde =  { workspace = true }
serde_json =  { workspace = true }
derive_builder = { workspace = true }
uuid = { workspace = true }
im = { workspace = true }
pin-project = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
async-graphql = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }

# For book tests
anyhow = { workspace = true, optional = true }

[dev-dependencies]
repo-composition-source = { path = "tests/composition/source" }
repo-composition-middle = { path = "tests/composition/middle" }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tracing-subscriber = { workspace = true }
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
proptest = "1"
errlanes = { workspace = true, features = ["classify-sqlx", "derive"] }

[[bench]]
name = "context"
harness = false

[workspace]
resolver = "2"
members = [
  "errlanes",
  "errlanes-derive",
  "es-entity-macros",
]

[workspace.dependencies]

errlanes = { path = "errlanes", version = "0.14.4-dev", default-features = false }
errlanes-derive = { path = "errlanes-derive", version = "0.14.4-dev" }
es-entity-macros = { path = "es-entity-macros", version = "0.14.4-dev" }

anyhow = "1.0"
async-stream = "0.3"
async-graphql = { version = "8.0.0-rc.5", default-features = false }
async-trait = "0.1"
base64 = { version = "0.23" }
chrono = { version = "0.4", features = ["clock", "serde"], default-features = false }
derive_builder = "0.20"
schemars = { version = "1.0", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.15"
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio-rustls", "postgres", "uuid", "chrono", "json" ] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time"] }
thiserror = "2.0"
uuid = { version = "1.23", features = ["serde", "v7"] }
im = { version = "15.1", features = ["serde"] }
pin-project = "1.1"
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
opentelemetry = { version = "0.33.0", default-features = false }
opentelemetry_sdk = { version = "0.33.0", features = ["rt-tokio"] }
reqwest = { version = "0.12", default-features = false }
futures = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
parking_lot = "0.12"
