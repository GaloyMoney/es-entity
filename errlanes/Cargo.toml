[package]
name = "errlanes"
description = "Four error lanes (Rejected/Denied/Transient/Fatal) carried in the type, not re-derived at every layer"
repository = "https://github.com/GaloyMoney/es-entity"
documentation = "https://docs.rs/errlanes"
version = "0.17.1"
edition = "2024"
license = "Apache-2.0"
categories = ["data-structures"]

[features]
default = ["derive"]
derive = ["dep:errlanes-derive"]
classify-sqlx = ["dep:sqlx"]
classify-serde-json = ["dep:serde_json"]
classify-reqwest = ["dep:reqwest"]
tracing = ["dep:tracing"]

[dependencies]
errlanes-derive = { workspace = true, optional = true }

sqlx = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
# "attributes" is the `#[tracing::instrument]` re-export `#[errlanes::instrument]`
# expands into; Cargo features cannot be conditioned on both `derive` and
# `tracing` at once, so it rides along with `tracing` itself.
tracing = { workspace = true, optional = true, features = ["attributes"] }

[dev-dependencies]
composition-consumer = { path = "tests/composition/consumer" }
downstream = { path = "tests/coherence/downstream" }
upstream = { path = "tests/coherence/upstream" }
http = "1"
tokio = { workspace = true }
trybuild = "1"
thiserror = "2"
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true }

[lints.clippy]
too_many_arguments = "allow"
